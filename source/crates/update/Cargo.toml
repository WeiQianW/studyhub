[package]
name = "studyhub_update"
version = "2.0.0"
edition = "2021"
description = "Offline cache + verified updates for the Study Hub desktop app"

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
